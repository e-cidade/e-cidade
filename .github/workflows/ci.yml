name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Composer + PHP lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP 7.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --no-check-publish --no-check-lock

      - name: Lint changed PHP files
        run: |
          # Linta apenas os arquivos PHP alterados (em relacao ao branch base),
          # evitando ruido de codigo legado ja existente.
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            BASE="origin/${GITHUB_BASE_REF}"
          else
            BASE="$(git merge-base HEAD origin/main 2>/dev/null || echo HEAD~1)"
          fi
          git diff --name-only --diff-filter=ACMR "$BASE"...HEAD -- '*.php' > /tmp/changed.txt 2>/dev/null || true

          if [ ! -s /tmp/changed.txt ]; then
            echo "Nenhum arquivo PHP alterado para lintar."
            exit 0
          fi

          fail=0
          while IFS= read -r file; do
            if ! php -d short_open_tag=On -l "$file" > /dev/null 2>&1; then
              php -d short_open_tag=On -l "$file" 2>&1 || true
              fail=$((fail + 1))
            fi
          done < /tmp/changed.txt

          if [ "$fail" -ne 0 ]; then
            echo "::error::$fail arquivo(s) PHP com erro de sintaxe."
            exit 1
          fi

          echo "Lint de PHP concluido com sucesso."
